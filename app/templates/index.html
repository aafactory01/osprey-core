<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Release & Operations Console</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/main.js" defer></script>
</head>
<body class="light-theme">
    <header>
        <h1>Service Release & Operations Console</h1>
        <button id="theme-toggle">Toggle Theme</button>
    </header>
    <main>
        <section id="health-section">
            <h2>SLA/SLO Health</h2>
            <div id="health-data">Loading...</div>
        </section>
        <section id="rollouts-section">
            <h2>Active Rollouts</h2>
            <div id="rollouts-data">Loading...</div>
        </section>
        <section id="workflow-section">
            <h2>Workflow Stage Timeline</h2>
            <div id="workflow-data">Loading...</div>
        </section>
        <section id="dreams-section">
            <h2>Night Dreaming DP-001</h2>
            <div id="dreams-data">Loading...</div>
        </section>
        <section id="receipts-section">
            <h2>Audit Receipts</h2>
            <div id="receipts-data">Loading...</div>
        </section>
    </main>
</body>
</html>
