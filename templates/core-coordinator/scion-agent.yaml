# osprey-core project template "coordinator" (lane C1). Only this file is parsed; content files are referenced by name.
schema_version: "1"
description: "osprey-core coordinator: routes S1_SPEC..S6_DEPLOY_CLOSE, delegates to sub-coordinators, verifies, reports; never implements"
agent_instructions: agents.md
system_prompt: system-prompt.md
default_harness_config: antigravity
model: "Gemini 4 Argon (High)"
resources:
  requests: {cpu: 500m, memory: 1Gi}
  limits: {cpu: 500m, memory: 1Gi}
  disk: 2Gi
env:
  OSPREY_ROLE: coordinator
