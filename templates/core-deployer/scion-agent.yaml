# osprey-core project template "deployer" (lane C1). Only this file is parsed; content files are referenced by name.
schema_version: "1"
description: "osprey-core deployer: S5_RELEASE_GATE deterministic checks and S6_DEPLOY_CLOSE Cloud Run rollout behind IAP"
agent_instructions: agents.md
system_prompt: system-prompt.md
default_harness_config: antigravity
model: "Gemini 4 Argon (High)"
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: 500m, memory: 1Gi}
  disk: 2Gi
env:
  OSPREY_ROLE: developer
